<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>DS Prints Transaction Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="pos-container">
      <header>
        <h1>DS Prints</h1>
        <button class="reset-btn mobile-reset" onclick="resetAll()">
          Reset
        </button>
      </header>

      <!-- Tabs -->
      <div class="tabs-container">
        <div id="tabs-list" class="tabs-list"></div>
        <button class="add-tab-btn" onclick="addNewTransaction()">
          + New Transaction
        </button>
      </div>

      <!-- Search & Reset -->
      <div class="search-reset_wrapper">
        <div class="search-container">
          <div class="input-group">
            <input
              type="text"
              id="serviceSearch"
              placeholder="Search (e.g. Xerox)..."
              onkeyup="filterServices()"
            />
            <button class="clear_search-btn" onclick="resetSearch()">
              Clear
            </button>
          </div>
        </div>
      </div>

      <!-- Main Layout -->
      <div class="table-summary_wrapper">
        <div class="table-area">
          <div class="table-wrapper">
            <table class="pos-table">
              <thead>
                <tr id="table-header-row">
                  <th>Service / Item</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th class="text-center">Quantity</th>
                </tr>
              </thead>
              <tbody id="service-rows"></tbody>
            </table>

            <div class="pagination-container">
              <button id="prevPage" class="btn-page" onclick="changePage(-1)">
                <<
              </button>
              <span id="pageInfo">Page 1 of 1</span>
              <button id="nextPage" class="btn-page" onclick="changePage(1)">
                >>
              </button>
            </div>
          </div>
        </div>

        <div class="summary">
          <h3>Summary</h3>
          <div class="summary-header">
            <button class="copy-btn" onclick="copySummary()">Copy</button>
            <hr class="dashed-line" />
          </div>

          <div id="order-summary-container" class="summary-wrapper">
            <table class="summary-table">
              <tbody id="summary-items"></tbody>
            </table>
          </div>

          <div class="total-summary">
            <div class="totals-text">
              <span id="item-count">0 items</span>
              <h2 id="grand-total">₱0.00</h2>
            </div>
            <button class="btn-pay" onclick="openPaymentModal()">💸 Pay</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Success Modal -->
    <div
      id="success-modal"
      class="modal-overlay"
      style="display: none; z-index: 10000"
    >
      <div class="modal-card success-card">
        <div class="success-icon">✓</div>
        <h3 id="success-message">Done</h3>
      </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal-overlay" style="display: none">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Complete Transaction</h3>
          <button class="close-modal" onclick="closePaymentModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="payment-row">
            <span>Total Amount:</span>
            <strong id="pay-total-display">₱0.00</strong>
          </div>
          <div class="input-group">
            <label>Cash Received (₱)</label>
            <input
              type="number"
              id="cashReceived"
              placeholder="Enter amount..."
              oninput="calculateChange()"
            />
          </div>
          <div class="change-display">
            <span>Change:</span>
            <h2 id="change-amount">₱0.00</h2>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="closePaymentModal()">
            Back
          </button>
          <button
            id="btn-done-payment"
            class="btn-save"
            onclick="completePayment()"
          >
            Done & Clear
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
